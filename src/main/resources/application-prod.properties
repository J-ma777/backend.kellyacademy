# =========================================
# KELLY ACADEMY LMS - Perfil PROD
# =========================================
# Activo cuando: SPRING_PROFILES_ACTIVE=prod
# Uso: despliegue en Render / Supabase
# =========================================

# -----------------------------------------
# JPA / Hibernate
# -----------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# -----------------------------------------
# Logging (reducido en prod)
# -----------------------------------------
logging.level.root=WARN
logging.level.com.kellyacademy=INFO
logging.level.org.hibernate.SQL=WARN

# -----------------------------------------
# Actuator (solo health publico)
# -----------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# -----------------------------------------
# Seeder (desactivado en prod)
# -----------------------------------------
app.seeder.enabled=false