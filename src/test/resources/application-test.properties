# spring.application.name=lms-backend-test

# -----------------------------------------
# Base de datos H2 en memoria
# -----------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------
# JPA / Hibernate
# -----------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# -----------------------------------------
# JWT (valores de prueba)
# -----------------------------------------
jwt.secret=VGhpc0lzQVRlc3RTZWNyZXRLZXlGb3JLZWxseUFjYWRlbXlMTVNCYWNrZW5kMjAyNlRlc3RpbmdPbmx5
jwt.expiration=3600000

# -----------------------------------------
# Flyway deshabilitado en tests
# -----------------------------------------
# Las migraciones V1-V9 son SQL de Postgres. H2 no las soporta al 100%.
# En tests, Hibernate crea el schema desde las entidades (create-drop).
spring.flyway.enabled=false

# -----------------------------------------
# Deshabilitar seeder en tests
# -----------------------------------------
app.seeder.enabled=false