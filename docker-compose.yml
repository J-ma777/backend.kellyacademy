# =========================================
# KELLY ACADEMY LMS - Docker Compose
# =========================================
# Servicios:
#   - postgres:  PostgreSQL 18
#   - pgadmin:   pgAdmin 4
#   - backend:   Kelly Academy API (Spring Boot)
#
# Uso:
#   docker-compose up -d --build       (Levantar todo el stack en Docker)
#   docker-compose up -d postgres      (Levantar solo la BD para desarrollo local con IDE/Maven)
#   docker-compose down                (Detener contenedores)
#   docker-compose down -v             (Detener + borrar volumenes de datos)
# =========================================

services:

  postgres:
    image: postgres:18-alpine
    container_name: kelly-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kelly_academy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kelly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kelly_academy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kelly-academy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kellyacademy.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - kelly-network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kelly-academy-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/kelly_academy
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kelly-network

volumes:
  postgres_data:
    name: kelly-academy-postgres-data
  pgadmin_data:
    name: kelly-academy-pgadmin-data

networks:
  kelly-network:
    name: kelly-academy-network
    driver: bridge