# =========================================
# KELLY ACADEMY LMS - Perfil DEV
# =========================================
# Activo cuando: SPRING_PROFILES_ACTIVE=dev
# Uso: desarrollo local con Postgres en Docker
# =========================================

# -----------------------------------------
# Carga de variables locales desde .env
# -----------------------------------------
# En desarrollo, Spring Boot lee el archivo .env de la raiz del proyecto.
# 'optional:' evita fallo si no existe (produccion usa variables del orquestador).
spring.config.import=optional:file:./.env[.properties]

# -----------------------------------------
# JPA / Hibernate
# -----------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------
# Logging (mas detalle en dev)
# -----------------------------------------
logging.level.root=INFO
logging.level.com.kellyacademy=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# -----------------------------------------
# Actuator (endpoints de diagnostico en dev)
# -----------------------------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# -----------------------------------------
# Seeder (activado en dev)
# -----------------------------------------
app.seeder.enabled=true