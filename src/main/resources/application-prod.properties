# =========================================
# KELLY ACADEMY LMS - Perfil PROD
# =========================================
# Activo cuando: SPRING_PROFILES_ACTIVE=prod
# Entorno: Render (Free Tier) + Supabase (Session Pooler 5432)
# =========================================

# -----------------------------------------
# Servidor (Render inyecta PORT)
# -----------------------------------------
server.port=${PORT:8080}
# No permitir que cabeceras aportadas por el cliente cambien getRemoteAddr().
server.forward-headers-strategy=none

# La instancia actual recibe trafico exclusivamente por el borde publico de Render.
# Cambiar a direct si se expone otro acceso; reevaluar el limite antes de desplegar.
app.client-ip.mode=${APP_CLIENT_IP_MODE:render-public}

# Limita solo POST /auth/login, compartido por instancias via PostgreSQL.
app.auth-rate-limit.enabled=${APP_AUTH_RATE_LIMIT_ENABLED:true}
app.auth-rate-limit.max-attempts=${APP_AUTH_RATE_LIMIT_MAX_ATTEMPTS:120}
app.auth-rate-limit.window-seconds=${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:900}

# -----------------------------------------
# Datasource (variables inyectadas por Render)
# -----------------------------------------
# DB_URL debe incluir: ?sslmode=require
# Formato Supabase Session Pooler:
#   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------
# HikariCP (pool conservador para 512MB RAM / 0.1 CPU)
# -----------------------------------------
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# -----------------------------------------
# JPA / Hibernate
# -----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# -----------------------------------------
# Flyway (mismo datasource, schema public)
# -----------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.schemas=public
spring.flyway.default-schema=public

# -----------------------------------------
# JWT
# -----------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# En produccion, especificar el origen HTTPS exacto del frontend en Render.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# -----------------------------------------
# Logging (reducido en prod)
# -----------------------------------------
logging.level.root=WARN
logging.level.com.kellyacademy=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO

# -----------------------------------------
# Actuator (solo health publico)
# -----------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# -----------------------------------------
# Seeder (desactivado en prod)
# -----------------------------------------
app.seeder.enabled=false

# -----------------------------------------
# Errores (no filtrar detalle al cliente)
# -----------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
